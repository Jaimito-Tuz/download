<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contracts — Reimbursor Solution Cars</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="main">
  <a class="brand" href="index.html">🚗 Reimbursor Solution Cars</a>
  <a href="index.html">Inventory</a>
  <a href="index.html#returns">Returns</a>
  <a href="contracts.html" class="active">Contracts</a>
</nav>

<div class="hero" style="padding:40px 32px;">
  <h1 style="font-size:1.8rem">Contract Lookup</h1>
  <p>Enter your policy number to view your Return & Recovery Agreement</p>
</div>

<div class="wrap contracts-bg">

  <div class="contract-lookup">
    <div class="policy-form" style="background:var(--bg-card);border:1px solid var(--border);">
      <label style="color:var(--fg)">
        Policy Number
        <input type="text" id="policy-input" placeholder="e.g. RSC-2024-7742" autocomplete="off" spellcheck="false"
               style="background:#fff;border:1.5px solid var(--border);color:var(--fg);">
      </label>
      <button class="btn gold" id="lookup-btn" style="width:auto;white-space:nowrap;padding:10px 24px">View Contract</button>
    </div>
    <p id="lookup-error" style="color:var(--danger);font-size:.82rem;margin-top:8px;min-height:1em"></p>
  </div>

  <div id="contract-result" hidden></div>

</div>

<footer>&copy; 2026 Reimbursor Solution Cars &nbsp;|&nbsp; All rights reserved</footer>

<!-- Payment dialog -->
<dialog id="checkout-dialog">
  <div class="dialog-header">
    <h2>Vehicle Recovery Payment</h2>
    <p id="dialog-subtitle"></p>
  </div>
  <div class="dialog-body">
    <div class="fee-breakdown">
      <div class="row"><span>Vehicle recovery — current market value</span><span id="show-market-value"></span></div>
      <div class="row total"><span>Total due</span><span id="show-total"></span></div>
    </div>
    <form id="pay-form" novalidate autocomplete="off">
      <label>Name on card
        <input name="name" type="text" autocomplete="off" maxlength="60" placeholder="Ana Perez">
        <span class="err" data-for="name"></span>
      </label>
      <label>Card number
        <input name="pan" type="text" inputmode="numeric" autocomplete="off" maxlength="23" placeholder="4242 4242 4242 4242">
        <span class="err" data-for="pan"></span>
      </label>
      <div class="row-2">
        <label>Expiry
          <input name="exp" type="text" inputmode="numeric" autocomplete="off" maxlength="5" placeholder="MM/YY">
          <span class="err" data-for="exp"></span>
        </label>
        <label>CVV
          <input name="cvv" type="password" inputmode="numeric" autocomplete="off" maxlength="4" placeholder="123">
          <span class="err" data-for="cvv"></span>
        </label>
      </div>
      <p id="result" class="result" role="status"></p>
      <div class="dialog-actions">
        <button type="button" class="btn ghost" id="cancel-btn">Cancel</button>
        <button type="submit" class="btn gold" id="pay-btn">Confirm Payment</button>
      </div>
    </form>
  </div>
</dialog>

<script src="contracts.js"></script>
</body>
</html>
