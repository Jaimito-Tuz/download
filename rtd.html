<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recovery Terms Document</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #f4f6f8; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .msg { text-align: center; color: #6b7280; font-size: .9rem; }
  .msg h2 { color: #0a1628; font-size: 1.1rem; margin: 0 0 8px; }
</style>
</head>
<body>
<div class="msg">
  <h2>Preparing your document…</h2>
  <p>Your Recovery Terms Document will download automatically.</p>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
"use strict";

const POLICIES = {
  "RSC-2024-7742": {
    holder:          "J. Martinez",
    vehicle:         { year: 2021, brand: "Cresta",  model: "Sport",    vin: "1CRST21X7MK204891", color: "Graphite Gray" },
    newVehicle:      { year: 2023, brand: "Veltron", model: "Prime XS", vin: "2VLTR23P9NK107344",  color: "Alpine Green"  },
    newVehiclePrice: 3860000,
    tradeInValue:    1450000,
    marketValue:     2280000,
    purchaseDate:    "September 14, 2026",
    policyExpiry:    "November 14, 2026",
  },
};

const money = (c) => "$" + (c / 100).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const STANDARD_RATE_MULTIPLIER = 1.25;

window.addEventListener("load", () => {
  const params   = new URLSearchParams(window.location.search);
  const id       = params.get("policy") || "RSC-2024-7742";
  const policy   = POLICIES[id] || POLICIES["RSC-2024-7742"];
  generateRTD(id, policy);
});

function generateRTD(id, policy) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: "pt", format: "letter" });

  const L = 56;
  const R = 556;
  const W = R - L;
  let y = 0;

  const sf  = (style, size, color) => { doc.setFont("helvetica", style); doc.setFontSize(size); doc.setTextColor(...(color || [26, 31, 46])); };
  const ln  = (x1, y1, x2, y2, c) => { doc.setDrawColor(...(c || [226, 230, 234])); doc.line(x1, y1, x2, y2); };
  const today = new Date().toLocaleDateString("en-US", { year: "numeric", month: "long", day: "numeric" });

  const v            = policy.vehicle;
  const nv           = policy.newVehicle;
  const standardRate = Math.round(policy.marketValue * STANDARD_RATE_MULTIPLIER);
  const savings      = standardRate - policy.marketValue;

  // ── Header ──
  doc.setFillColor(10, 22, 40);
  doc.rect(0, 0, 612, 90, "F");
  sf("bold", 16, [255, 255, 255]);
  doc.text("REIMBURSOR SOLUTION CARS", L, 32);
  sf("normal", 8.5, [201, 146, 42]);
  doc.text("4820 Westfield Auto Park, Suite 110  ·  Austin, TX 78749  ·  (512) 448-9200", L, 48);
  sf("normal", 8, [180, 190, 210]);
  doc.text("Recovery Terms Document — CONFIDENTIAL", L, 64);
  doc.text(`RTD Ref: ${id}  ·  Date: ${today}  ·  Policy Expiry: ${policy.policyExpiry}`, L, 78);

  y = 110;

  doc.setFillColor(244, 246, 248);
  doc.rect(L, y, W, 24, "F");
  sf("bold", 10, [10, 22, 40]);
  doc.text("RECOVERY TERMS DOCUMENT — RATE SCHEDULE & FINANCIAL DETAILS", L + W / 2, y + 15.5, { align: "center" });
  y += 36;

  const section = (title) => {
    sf("bold", 8, [201, 146, 42]);
    doc.text(title, L, y);
    ln(L + doc.getTextWidth(title) + 6, y - 1, R, y - 1, [201, 146, 42]);
    y += 14;
  };

  const para = (text) => {
    sf("normal", 8.5, [26, 31, 46]);
    const lines = doc.splitTextToSize(text, W);
    doc.text(lines, L, y);
    y += lines.length * 12 + 6;
  };

  // ── Parties ──
  doc.setFillColor(244, 246, 248);
  doc.rect(L, y, W / 2 - 6, 44, "F");
  doc.rect(L + W / 2 + 6, y, W / 2 - 6, 44, "F");
  sf("bold", 7.5, [107, 114, 128]);
  doc.text("DEALER", L + 8, y + 12);
  doc.text("CUSTOMER", L + W / 2 + 14, y + 12);
  sf("bold", 9, [10, 22, 40]);
  doc.text("Reimbursor Solution Cars", L + 8, y + 26);
  doc.text(policy.holder, L + W / 2 + 14, y + 26);
  sf("normal", 8, [107, 114, 128]);
  doc.text("Austin, TX 78749", L + 8, y + 38);
  y += 58;

  // ── Section 1: Vehicle Return ──
  section("SECTION 1 — VEHICLE RETURN");
  para("The following vehicle will be returned to Reimbursor Solution Cars inventory:");
  y += 2;

  doc.setDrawColor(226, 230, 234);
  doc.rect(L, y, W, 54, "S");
  sf("bold", 9, [10, 22, 40]);
  doc.text(`${nv.year} ${nv.brand} ${nv.model}`, L + 10, y + 15);
  sf("normal", 8, [107, 114, 128]);
  doc.text(`VIN: ${nv.vin}  ·  ${nv.color}`, L + 10, y + 27);
  doc.text(`Original purchase price: ${money(policy.newVehiclePrice)}`, L + 10, y + 39);
  doc.text("Return credit: Pending — processing 15–30 business days from return completion", L + 10, y + 51);
  y += 68;

  // ── Section 2: Trade-In ──
  section("SECTION 2 — ORIGINAL TRADE-IN");
  para("Vehicle surrendered as trade-in at time of original purchase:");
  y += 2;

  doc.setDrawColor(226, 230, 234);
  doc.rect(L, y, W, 44, "S");
  sf("bold", 9, [10, 22, 40]);
  doc.text(`${v.year} ${v.brand} ${v.model}`, L + 10, y + 15);
  sf("normal", 8, [107, 114, 128]);
  doc.text(`VIN: ${v.vin}  ·  ${v.color}`, L + 10, y + 27);
  doc.text(`Original appraisal credit: ${money(policy.tradeInValue)} (applied to purchase financing at time of sale)`, L + 10, y + 39);
  y += 58;

  // ── Section 3: Recovery rate ──
  section("SECTION 3 — VEHICLE RECOVERY RATE SCHEDULE");
  para("To recover the original trade-in vehicle, the following payment is required:");
  y += 2;

  doc.setFillColor(209, 250, 229);
  doc.rect(L, y, W, 18, "F");
  sf("bold", 8, [6, 95, 70]);
  doc.text("✓  Confirmed in inventory — available for immediate recovery", L + 8, y + 12);
  y += 26;

  const rows = [
    ["Vehicle", `${v.year} ${v.brand} ${v.model}  ·  ${v.color}`],
    ["Valuation method", "Current market valuation (see Section 4.2)"],
    ["Standard recovery rate", money(standardRate)],
    ["Early return discount (policy active)", `– ${money(savings)}`],
    ["Net early return rate", money(policy.marketValue) + " USD"],
    ["Taxes & applicable fees", "Factored into recovery amount"],
    ["Title transfer", "Processed upon recovery completion"],
  ];

  rows.forEach(([label, val], i) => {
    const ry = y + i * 20;
    if (i % 2 === 0) { doc.setFillColor(249, 250, 251); doc.rect(L, ry, W, 20, "F"); }
    sf("normal", 8, [107, 114, 128]);
    doc.text(label, L + 8, ry + 13);
    sf("normal", 8, [26, 31, 46]);
    doc.text(val, R - 8, ry + 13, { align: "right" });
  });
  y += rows.length * 20 + 2;

  doc.setFillColor(10, 22, 40);
  doc.rect(L, y, W, 24, "F");
  sf("bold", 10, [255, 255, 255]);
  doc.text("Early Return Rate — Amount Due", L + 8, y + 16);
  sf("bold", 11, [232, 184, 74]);
  doc.text(`${money(policy.marketValue)} USD`, R - 8, y + 16, { align: "right" });
  y += 36;

  // ── Section 4: Terms ──
  section("SECTION 4 — TERMS & CONDITIONS");

  const terms = [
    ["4.1", "This document and the accompanying Vehicle Return & Recovery Agreement are binding upon signature and payment authorization. Customer acknowledges all terms herein."],
    ["4.2", `Recovery amount reflects current market valuation at time of processing, net of applicable adjustments as determined by RSC appraisal standards. The early return rate (${money(policy.marketValue)}) is available exclusively to customers whose return is initiated while their policy remains active. Standard rate (${money(standardRate)}) applies upon policy expiration (${policy.policyExpiry}). Market valuation is based on certified pre-owned resale data and may differ from the original trade-in appraisal value.`],
    ["4.3", "No refunds will be issued after recovery processing has been initiated. Payment authorization constitutes the Customer's consent for RSC to release the vehicle from certified inventory and process the title transfer."],
    ["4.4", "Return credit for the surrendered vehicle, if applicable, is subject to standard processing timelines (15–30 business days) and lender coordination. RSC will provide documentation to assist the Customer's financing institution with final settlement."],
  ];

  terms.forEach(([num, text]) => {
    sf("bold", 8.5, [10, 22, 40]);
    doc.text(num, L, y);
    sf("normal", 8.5, [26, 31, 46]);
    const lines = doc.splitTextToSize(text, W - 24);
    doc.text(lines, L + 20, y);
    y += lines.length * 11 + 10;
  });

  // ── Signatures ──
  y += 10;
  ln(L, y, L + 180, y);
  ln(R - 180, y, R, y);
  y += 10;
  sf("normal", 8, [107, 114, 128]);
  doc.text("Customer signature", L, y);
  doc.text("Dealer representative", R - 180, y);
  y += 18;
  ln(L, y, L + 180, y);
  ln(R - 180, y, R, y);
  y += 10;
  doc.text("Date", L, y);
  doc.text("Date", R - 180, y);

  doc.save(`RTD-${id}.pdf`);
}
</script>
</body>
</html>
